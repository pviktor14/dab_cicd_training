resources:
  jobs:
    ETL_simple_job:
      name: ETL_simple_job
      tasks:
        - task_key: bronze
          notebook_task:
            notebook_path: src/01_bronze
            source: WORKSPACE
        - task_key: silver
          depends_on:
            - task_key: bronze
          notebook_task:
            notebook_path: src/02_silver
            source: WORKSPACE
        - task_key: gold
          depends_on:
            - task_key: silver
          notebook_task:
            notebook_path: src/03_gold
            source: WORKSPACE
      queue:
        enabled: true
      performance_target: PERFORMANCE_OPTIMIZED
