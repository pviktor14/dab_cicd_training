# CI/CD lab (simple) – one bundle, two targets.
#
#   dev  = your private sandbox: "[dev <you>] ..." names, schedule paused,
#          notebooks linked to your Git folder (code edits are live).
#   prod = the "released" version: "[prod <you>] ..." names, schedule active,
#          notebooks COPIED at deploy time (frozen until the next prod deploy).
#
# Validate + deploy from the workspace: open this file -> Deployments (rocket icon)
# -> pick a target -> Deploy.

bundle:
  name: cicd_lab

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog the job writes to
    default: uniqa_training
  schema:
    description: Schema the job writes to (set per target below)

targets:
  dev:
    mode: development          # prefix [dev <you>], pauses schedules, source-linked
    default: true
    variables:
      schema: cicd_${workspace.current_user.short_name}_dev

  prod:
    mode: production
    variables:
      schema: cicd_${workspace.current_user.short_name}_prod

    # Production mode wants ONE well-defined deployment folder.
    # Real life: a folder only the CI/CD service principal can write to.
    # Training: 14 people deploy their own "prod" copy -> keep it in your user folder.
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}

    # 14 prod copies in one workspace -> keep them apart by name.
    presets:
      name_prefix: "[prod ${workspace.current_user.short_name}] "

    # Who the prod job runs as.
    # Real life:  run_as: { service_principal_name: <application-id-of-prod-SP> }
    run_as:
      user_name: ${workspace.current_user.userName}

    permissions:
      - level: CAN_MANAGE
        user_name: ${workspace.current_user.userName}
      - level: CAN_VIEW
        group_name: users
